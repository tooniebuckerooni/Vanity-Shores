<title>Vanity Shores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --void:#10071c; --dusk:#2a1140; --bezel:#1b0c2c;
  --chrome:#f5e6d3; --dim:#a08cb4;
  --hot:#ff2e88; --surf:#21e0d6; --gold:#ffc23d;
  --ui:"Silkscreen",ui-monospace,monospace;
  --body:"VT323",ui-monospace,monospace;
  --marquee:"Monoton",fantasy,cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--chrome);
  font-family:var(--ui);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:16px; overflow:hidden;
  background-image:
    radial-gradient(120% 90% at 50% 0%, #2a1140 0%, #10071c 62%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px);
}
#cab{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  max-width:100%;
}
#bezelwrap{
  position:relative; line-height:0;
  padding:10px; border-radius:6px;
  background:linear-gradient(180deg,#26103c,#150a24);
  box-shadow:0 0 0 1px var(--hot), 0 0 26px -6px rgba(255,46,136,.55), 0 24px 60px -20px #000;
}
canvas#screen{
  display:block; image-rendering:pixelated; image-rendering:crisp-edges;
  background:#000; border-radius:2px; cursor:crosshair; touch-action:manipulation;
  max-width:100%;
}
#scan{
  position:absolute; inset:10px; pointer-events:none; border-radius:2px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
  mix-blend-mode:multiply;
}
#vig{
  position:absolute; inset:10px; pointer-events:none; border-radius:2px;
  background:radial-gradient(115% 105% at 50% 45%, transparent 55%, rgba(16,7,28,.55) 100%);
}
#namebox{
  position:absolute; display:none; font-family:var(--body);
  background:#1a0f2e; color:var(--gold); border:2px solid var(--hot);
  outline:none; padding:2px 6px; letter-spacing:.06em;
}
#namebox:focus-visible{box-shadow:0 0 0 2px var(--surf)}
#strip{
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:center;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  min-height:16px;
}
#strip b{color:var(--chrome);font-weight:400}
#strip .m{color:var(--gold)} #strip .f{color:var(--hot)} #strip .c{color:var(--surf)}
#strip .sep{color:#4b3168}
#foot{
  font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#6b4d8a;
  text-align:center; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
}
#foot button{
  font:inherit; letter-spacing:.16em; text-transform:uppercase;
  background:none; border:none; color:#8a68ad; cursor:pointer; padding:2px 4px;
}
#foot button:hover{color:var(--surf)}
#foot button:focus-visible{outline:2px solid var(--surf);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important} }
</style>

<div id="cab">
  <div id="bezelwrap">
    <canvas id="screen" width="320" height="200" aria-label="Vanity Shores game screen"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
    <input id="namebox" maxlength="14" autocomplete="off" spellcheck="false" aria-label="Enter your name">
  </div>
  <div id="strip"></div>
  <div id="foot">
    <button id="btnMusic" type="button">Music: On</button>
    <button id="btnSfx" type="button">Sound FX: On</button>
    <button id="btnScale" type="button">Size</button>
    <button id="btnWipe" type="button">Erase Save</button>
    <span>Act 1 &middot; Level 1 &middot; Free Demo &middot; keys M / N</span>
  </div>
</div>
<script>
"use strict";
/* ============================================================================
   VANITY SHORES — Act 1, Level 1
   A self-contained 16-bit-style adventure. No external assets: every sprite,
   backdrop and note is generated at runtime.
   ---------------------------------------------------------------------------
   SECTIONS:  0 core  1 art  2 backdrops  3 audio  4 engine  5 content  6 boot
   ========================================================================= */

/* ---------- 0. CORE ------------------------------------------------------ */
const W = 320, H = 200;
const cvs = document.getElementById('screen');
let   g   = cvs.getContext('2d', { alpha:false });
const MAIN = g;
/* The world is authored in a 320x200 logical space and always will be — that is
   the pixel art. SC is how many real pixels each logical pixel gets on the main
   canvas, which lets type carry SC times the detail while the art stays chunky.
   Offscreen bakes run at TXSC=1 so painted signs stay part of the pixel art. */
let SC = 3, TXSC = 3;
function withTarget(ctx, fn){ const o=g, ot=TXSC; g=ctx; TXSC=1; fn(); g=o; TXSC=ot; }
function offscreen(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return c; }
g.imageSmoothingEnabled = false;

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function r(x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,w|0,h|0); }
function px(x,y,c){ g.fillStyle=c; g.fillRect(x|0,y|0,1,1); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/* World palette — sun-bleached resort at golden hour */
const P = {
  ink:'#160b22', ink2:'#241134', shadow:'#3a1d4e',
  bone:'#f5e6d3', dim:'#a08cb4',
  hot:'#ff2e88', hot2:'#c41d68', surf:'#21e0d6', surf2:'#0e9c97',
  gold:'#ffc23d', gold2:'#c98a1a', amber:'#ff8a3d',
  sky1:'#ff9a4d', sky2:'#ff5f8f', sky3:'#7b3fa0', sky4:'#2e1a52',
  sea1:'#1b5c8a', sea2:'#2a7fa8', sea3:'#48b3c4', foam:'#cfeef2',
  sand:'#e8c98f', sand2:'#c9a468', sand3:'#9c7b48',
  wood:'#9c6b3f', wood2:'#7a5230', wood3:'#5c3d24', wood4:'#b98a55',
  palm:'#2c1a3e', palmL:'#4a2c66',
  white:'#ffffff', black:'#000000'
};

/* ---------- 1. ART: procedural cast -------------------------------------- */
/* One renderer, many people. Every NPC is this function with different knobs. */

const SKIN = {
  fair:{ s:'#f0c9a0', d:'#c9976c', l:'#ffe0bd' },
  tan :{ s:'#d99a63', d:'#a86f45', l:'#f2bb85' },
  deep:{ s:'#8a5433', d:'#5e3520', l:'#a97048' },
  burn:{ s:'#f0533f', d:'#b8352a', l:'#ff7a63' },
  pale:{ s:'#f7ddc4', d:'#d0ab8c', l:'#fff2e2' }
};

function hairShape(x, hy, hw, style, c, c2, sway){
  // x = left edge of head, hy = top of head, hw = head width
  switch(style){
    case 'blowout': // feathered 80s wall of hair
      r(x-1,hy-4,hw+2,4,c); r(x-3,hy-2,3,8,c); r(x+hw,hy-2,3,8,c);
      r(x+1,hy-6,hw-2,2,c); r(x-2,hy-3,2,2,c2); r(x+hw,hy-3,2,2,c2);
      r(x+1,hy,hw-4,2,c);                       // fringe over the brow
      r(x+2,hy-5,3,2,c2); break;
    case 'spikes': // bleached surf spikes
      for(let i=0;i<5;i++){ const sx=x+i*2; r(sx,hy-3-(i%2?2:0),2,4+(i%2?2:0),c); }
      r(x-1,hy-1,hw+2,3,c); r(x,hy-1,hw,1,c2); break;
    case 'perm': // big volumized perm
      r(x-3,hy-4,hw+6,7,c); r(x-4,hy-1,2,8,c); r(x+hw+2,hy-1,2,8,c);
      r(x-2,hy-5,hw+4,2,c); px(x-1,hy-2,c2); px(x+hw,hy-2,c2);
      r(x+1,hy-4,3,2,c2); break;
    case 'ponytail': // slicked back, tail out the rear
      r(x-1,hy-2,hw+2,4,c); r(x-1,hy-2,hw+2,1,c2);
      r(x+hw+1,hy+1,2,7,c); r(x+hw+2,hy+5+sway,2,4,c); break;
    case 'pomp': // greased pompadour
      r(x-1,hy-4,hw+2,5,c); r(x,hy-6,hw-2,3,c); r(x+1,hy-6,3,2,c2); break;
    case 'bun':
      r(x-1,hy-2,hw+2,4,c); r(x+hw-1,hy-5,4,4,c); px(x+hw,hy-4,c2); break;
    case 'turban':
      r(x-2,hy-5,hw+4,7,c); r(x-2,hy-3,hw+4,1,c2); r(x+hw,hy-7,3,3,P.gold);
      px(x+hw+1,hy-6,P.white); break;
    case 'cap':
      r(x-1,hy-3,hw+2,4,c); r(x-4,hy-1,5,2,c2); break;
    case 'bald': r(x,hy,hw,2,SKIN.fair.d); break;
    default: r(x-1,hy-3,hw+2,5,c);
  }
}

/* Tint a hex colour toward white (amt>0) or black (amt<0). */
function shade(hex, amt){
  const c = hex2rgb(hex), f = amt < 0 ? 0 : 255, k = Math.abs(amt);
  return '#' + c.map(v => Math.round(v + (f-v)*k).toString(16).padStart(2,'0')).join('');
}

/* Draw a person. (x,y) = centre of feet. o = look options. t = ms clock.
   Rendered into a scratch buffer first so the whole silhouette can be given a
   dark keyline — that outline is what stops a sprite reading as a stack of
   boxes against a busy backdrop. Light comes from the upper left throughout. */
const _pbuf = offscreen(44, 68), _pctx = _pbuf.getContext('2d');
const _pout = offscreen(44, 68), _octx = _pout.getContext('2d');
const PBX = 22, PBY = 60;

function drawPerson(x, y, o, t, walkPhase){
  const tw = 10 + ((o.build||0) > 0 ? 3 : 0) + ((o.build||0) < 0 ? -2 : 0);
  g.globalAlpha = .26; r((x|0)-tw/2-2, y, tw+4, 2, P.ink); g.globalAlpha = 1;

  _pctx.clearRect(0,0,44,68);
  let info = null;
  withTarget(_pctx, () => { info = drawPersonRaw(PBX, PBY, o, t, walkPhase); });

  _octx.clearRect(0,0,44,68);
  _octx.globalCompositeOperation = 'source-over';
  _octx.drawImage(_pbuf, 0, 0);
  _octx.globalCompositeOperation = 'source-in';
  _octx.fillStyle = '#130a1e';
  _octx.fillRect(0,0,44,68);
  _octx.globalCompositeOperation = 'source-over';

  const ox = (x|0) - PBX, oy = (y|0) - PBY;
  g.drawImage(_pout, ox-1, oy); g.drawImage(_pout, ox+1, oy);
  g.drawImage(_pout, ox, oy-1); g.drawImage(_pout, ox, oy+1);
  g.drawImage(_pbuf, ox, oy);
  return info;
}

function drawPersonRaw(x, y, o, t, walkPhase){
  const sk   = SKIN[o.skin||'tan'];
  const size = o.size|0;
  const bd   = o.build||0;
  const legH = 15 + Math.round(size*0.45);
  const torH = 13 + Math.round(size*0.45);
  const hdH  = 10, hdW = 9;
  const tw   = 10 + (bd>0?3:0) + (bd<0?-2:0);
  const bob  = (o.still||REDUCED) ? 0 : (Math.floor(t/420)%2 ? 0 : -1);
  const wk   = walkPhase||0;

  const cx   = x|0;
  const legT = (y-legH)|0;
  const torT = (legT-torH+bob)|0;
  const hdT  = (torT-hdH)|0;
  const hx   = (cx-(hdW>>1))|0;

  /* legs */
  const step  = wk ? (Math.sin(wk)*2)|0 : 0;
  const pants = o.pants||'#2f3a6b', pantsD = o.pantsD||'#1e2648';
  if(o.skirt){
    r(cx-tw/2, legT-1, tw, 7, o.skirt);
    r(cx-tw/2, legT-1, 1, 7, shade(o.skirt,.16));
    r(cx+tw/2-1, legT-1, 1, 7, shade(o.skirt,-.22));
    r(cx-tw/2, legT+5, tw, 1, pantsD);
    r(cx-3+step, legT+6, 2, legH-6, sk.s);
    r(cx+1-step, legT+6, 2, legH-6, sk.d);
  } else {
    r(cx-4+step, legT, 3, legH, pants);
    r(cx+1-step, legT, 3, legH, shade(pants,-.16));
    r(cx-4+step, legT, 1, legH, shade(pants,.14));
    r(cx-4+step, legT, 3, 1, pantsD); r(cx+1-step, legT, 3, 1, pantsD);
  }
  const sh = o.shoes||'#e9e4d8';
  r(cx-5+step, y-2, 4, 2, sh); r(cx+1-step, y-2, 4, 2, shade(sh,-.14));

  /* torso */
  const sc = o.shirt||'#e94f6a', scD = o.shirtD||'#b8324a';
  const fig = o.figure || 'straight';
  r(cx-tw/2, torT, tw, torH, sc);
  if(bd>0) r(cx-tw/2-1, torT+torH-6, tw+2, 6, sc);        // a fuller middle
  if(fig === 'broad') r(cx-tw/2-1, torT, tw+2, 4, sc);    // shoulders carry it
  if(fig === 'curved' || fig === 'hourglass'){
    const X = fig === 'hourglass' ? 1 : 0;                 // how far to push it
    r(cx-tw/2+1, torT+3, tw-2, 2, shade(sc, .13));         // chest
    r(cx-tw/2+1, torT+5, tw-2, 1, shade(sc, -.14));
    if(X){
      r(cx-tw/2-1, torT+3, 2, 3, sc);   r(cx+tw/2-1, torT+3, 2, 3, sc);
      r(cx-tw/2-1, torT+3, 1, 1, shade(sc, .22));
      r(cx+tw/2,   torT+5, 1, 1, shade(sc, -.24));
    }
    g.clearRect(cx-tw/2,       torT+torH-8, 1+X, 4);       // waist nips in
    g.clearRect(cx+tw/2-1-X,   torT+torH-8, 1+X, 4);
    const hipC = o.skirt || sc;
    r(cx-tw/2-1-X, torT+torH-4, tw+2+X*2, 4, hipC);        // and the hips out
    r(cx-tw/2-1-X, torT+torH-4, tw+2+X*2, 1, shade(hipC, .12));
    if(X){                                                 // a turn, so there is a back to see
      r(cx+tw/2+1, torT+torH-4, 2, 5, hipC);
      r(cx+tw/2+1, torT+torH-4, 1, 5, shade(hipC, .10));
      r(cx+tw/2+2, torT+torH-1, 1, 2, shade(hipC, -.22));
    }
  }
  r(cx-tw/2, torT, tw, 1, o.shirtL||scD);
  r(cx-tw/2, torT, 1, torH, shade(sc,.16));               // lit edge
  r(cx+tw/2-1, torT, 1, torH, shade(sc,-.20));            // shadow edge
  r(cx-2, torT+1, 4, 1, shade(sc,-.16));                  // shadow under the chin
  r(cx-tw/2, torT+torH-1, tw, 1, shade(sc,-.30));         // hem
  g.clearRect(cx-tw/2, torT, 1, 1);                       // shoulders slope
  g.clearRect(cx+tw/2-1, torT, 1, 1);

  if(o.shirtStyle==='hawaii'){
    const q=rnd32(7);
    for(let i=0;i<10;i++){ const px1=cx-tw/2+((q()*tw)|0), py=torT+2+((q()*(torH-3))|0);
      px(px1,py,P.gold); px(px1+1,py,P.surf); }
  } else if(o.shirtStyle==='tank'){
    r(cx-tw/2, torT, 2, torH, sk.s); r(cx+tw/2-2, torT, 2, torH, sk.d);
    r(cx-1, torT, 2, 3, sk.s);
  } else if(o.shirtStyle==='blazer'){
    r(cx-1, torT+1, 2, torH-1, o.inner||P.bone);
    r(cx-tw/2+2, torT+1, 2, 5, scD); r(cx+tw/2-4, torT+1, 2, 5, shade(scD,-.18));
    r(cx-tw/2+2, torT+6, 1, torH-7, shade(sc,-.12));
  } else if(o.shirtStyle==='sequin'){
    const q=rnd32(19+((t/260)|0)%5);
    for(let i=0;i<14;i++) px(cx-tw/2+((q()*tw)|0), torT+((q()*torH)|0), P.gold);
    r(cx-1, torT+1, 2, torH-1, o.inner||P.bone);
  } else if(o.shirtStyle==='bikini'){
    r(cx-tw/2, torT, tw, torH, sk.s);                     // skin
    r(cx+tw/2-2, torT, 2, torH, sk.d);
    r(cx-tw/2, torT+3, tw, 3, sc);                        // band
    r(cx-tw/2, torT+3, tw, 1, shade(sc,.18));
    px(cx, torT+4, shade(sc,-.25));
    r(cx-tw/2, torT+torH-3, tw, 3, sc);                   // briefs
    r(cx-tw/2, torT+torH-3, tw, 1, shade(sc,.14));
    r(cx-1, torT-1, 2, 4, sc);                            // halter tie
  } else if(o.shirtStyle==='lingerie'){
    r(cx-tw/2, torT, tw, torH, sk.s);
    r(cx+tw/2-2, torT, 2, torH, sk.d);
    r(cx-tw/2, torT+2, tw, 4, sc);
    r(cx-tw/2, torT+2, tw, 1, o.inner||'#f0dce6');        // lace trim
    r(cx-tw/2, torT+6, tw, 1, o.inner||'#f0dce6');
    for(let i=0;i<tw;i+=2) px(cx-tw/2+i, torT+6, sc);
    r(cx-tw/2, torT+torH-4, tw, 3, sc);
    r(cx-tw/2, torT+torH-2, tw, 1, o.inner||'#f0dce6');
    r(cx-tw/2-1, torT+torH-1, 2, 1, o.inner||'#f0dce6');  // strap over the hip
    r(cx+tw/2-1, torT+torH-1, 2, 1, o.inner||'#f0dce6');
  } else if(o.shirtStyle==='slip'){
    r(cx-tw/2, torT, tw, 2, sk.s);                        // bare shoulders
    r(cx-tw/2+1, torT-1, 1, 3, sc); r(cx+tw/2-2, torT-1, 1, 3, sc);   // straps
    r(cx-tw/2, torT+2, tw, torH-2, sc);
    r(cx-tw/2, torT+2, tw, 1, shade(sc,.20));
    r(cx+tw/2-1, torT+2, 1, torH-2, shade(sc,-.20));
    px(cx-1, torT+4, shade(sc,.14));
  } else if(o.shirtStyle==='corset'){
    r(cx-tw/2, torT, tw, torH, sc);
    r(cx-tw/2, torT, tw, 2, sk.s);                        // above the line
    r(cx-tw/2, torT+2, tw, 1, shade(sc,.22));
    for(let y=torT+4; y<torT+torH-1; y+=2){               // lacing
      px(cx-1, y, o.inner||P.bone); px(cx+1, y+1, o.inner||P.bone);
    }
    r(cx-tw/2, torT+torH-1, tw, 1, shade(sc,-.28));
  } else if(o.shirtStyle==='halter'){
    r(cx-tw/2, torT, tw, torH, sk.s);
    r(cx+tw/2-2, torT, 2, torH, sk.d);
    r(cx-tw/2, torT+2, tw, 5, sc);
    r(cx-tw/2, torT+2, tw, 1, shade(sc,.16));
    r(cx-1, torT-2, 2, 4, sc);                            // neck strap
  } else if(o.shirtStyle==='mesh'){
    r(cx-tw/2, torT, tw, torH, sk.s);                     // it is barely a shirt
    r(cx+tw/2-2, torT, 2, torH, sk.d);
    for(let y = torT; y < torT+torH; y += 2)
      for(let x = cx-tw/2; x < cx+tw/2; x += 2)
        px(x + (((y-torT)/2) % 2 ? 1 : 0), y, sc);
    r(cx-tw/2, torT, tw, 1, shade(sc, .3));
    r(cx-1, torT, 2, torH, sc);
    r(cx-tw/2, torT+torH-1, tw, 1, sc);
  } else if(o.shirtStyle==='polo'){
    r(cx-2, torT, 4, 4, o.inner||P.white);
    r(cx-3, torT-1, 2, 3, o.inner||P.white); r(cx+1, torT-1, 2, 3, shade(o.inner||P.white,-.12));
  }

  /* arms — posture is most of what separates one person from another */
  const armY = torT+2, armL = torH-2;
  const sleeve = o.shirtStyle==='tank' ? sk.s : sc;
  const sleeveD = shade(sleeve,-.18);
  const swing = wk ? (Math.sin(wk+Math.PI)*1.5)|0 : 0;
  switch(wk ? '' : (o.pose||'')){
    case 'crossed':                                        // folded, unimpressed
      r(cx-tw/2-2, armY+3, tw+4, 3, sleeve);
      r(cx-tw/2-2, armY+3, tw+4, 1, shade(sleeve,.16));
      r(cx-tw/2-1, armY+6, 3, 2, sk.s); r(cx+tw/2-2, armY+6, 3, 2, sk.d);
      break;
    case 'hold':                                           // something in the near hand
      r(cx-tw/2-2, armY, 2, armL, sleeve);
      r(cx-tw/2-2, armY+armL, 2, 2, sk.s);
      r(cx+tw/2, armY, 2, armL-4, sleeveD);
      r(cx+tw/2, armY+armL-5, 4, 2, sleeveD);
      r(cx+tw/2+4, armY+armL-5, 2, 2, sk.d);
      break;
    case 'pocket':                                         // one hand away, casually
      r(cx-tw/2-2, armY, 2, armL, sleeve);
      r(cx-tw/2-2, armY+armL, 2, 2, sk.s);
      r(cx+tw/2, armY, 2, armL-3, sleeveD);
      r(cx+tw/2-1, armY+armL-3, 3, 2, sleeveD);
      break;
    case 'stiff':                                          // held clear of the body
      r(cx-tw/2-3, armY+1, 2, armL, sleeve);
      r(cx+tw/2+1, armY+1, 2, armL, sleeveD);
      r(cx-tw/2-3, armY+armL+1, 2, 2, sk.s);
      r(cx+tw/2+1, armY+armL+1, 2, 2, sk.d);
      break;
    default:
      r(cx-tw/2-2, armY+swing, 2, armL, sleeve);
      r(cx+tw/2,   armY-swing, 2, armL, sleeveD);
      r(cx-tw/2-2, armY+armL+swing, 2, 2, sk.s);
      r(cx+tw/2,   armY+armL-swing, 2, 2, sk.d);
  }

  /* neck + head */
  r(cx-1, torT-2, 2, 2, sk.d);
  r(hx, hdT, hdW, hdH, sk.s);
  r(hx, hdT, hdW, 1, sk.l);
  r(hx, hdT, 1, hdH, shade(sk.s,.12));                     // lit cheek
  r(hx+hdW-1, hdT+1, 1, hdH-1, sk.d);                      // shadow cheek
  r(hx, hdT+hdH-1, hdW, 1, sk.d);
  r(hx+4, hdT+4, 1, 3, shade(sk.s,-.10));                  // nose
  g.clearRect(hx, hdT, 1, 1); g.clearRect(hx+hdW-1, hdT, 1, 1);            // crown
  g.clearRect(hx, hdT+hdH-1, 1, 1); g.clearRect(hx+hdW-1, hdT+hdH-1, 1, 1); // jaw
  if(o.skin==='burn'){ px(hx+2,hdT+3,P.bone); px(hx+6,hdT+5,P.bone); px(hx+4,hdT+7,P.bone); }

  const blink = (!REDUCED && Math.floor(t/2600)%7===0 && Math.floor(t/130)%2===0);
  if(!blink){
    px(hx+2, hdT+4, P.ink); px(hx+6, hdT+4, P.ink);
    px(hx+2, hdT+3, shade(sk.s,-.28)); px(hx+6, hdT+3, shade(sk.s,-.28));   // brows
  } else { r(hx+2,hdT+4,1,1,sk.d); r(hx+6,hdT+4,1,1,sk.d); }
  r(hx+3, hdT+7, 3, 1, o.lips || sk.d);
  if(o.stubble) r(hx+1, hdT+6, hdW-2, 3, 'rgba(40,25,60,.35)');

  hairShape(hx, hdT, hdW, o.hair||'blowout', o.hairC||'#3b2416', o.hairC2||'#6b4426',
            (Math.floor(t/300)%2));

  switch(o.acc){
    case 'shades': r(hx+1,hdT+3,3,3,P.ink); r(hx+5,hdT+3,3,3,P.ink);
                   r(hx+4,hdT+4,1,1,P.ink); px(hx+2,hdT+3,'#5f93ad'); break;
    case 'chain':  r(cx-2,torT+2,4,1,P.gold); px(cx,torT+3,P.gold); break;
    case 'fanny':  r(cx-tw/2,legT-3,tw,3,'#4de0a0'); r(cx-1,legT-2,2,1,P.ink); break;
    case 'band':   r(hx-1,hdT+1,hdW+2,2,P.hot); break;
    case 'hoops':  r(hx-1,hdT+4,1,3,P.gold); r(hx+hdW,hdT+4,1,3,P.gold); break;
    case 'visor':  r(hx-2,hdT+2,hdW+4,2,P.hot); break;
  }
  if(o.hat==='fedora'){ r(hx-3,hdT-1,hdW+6,2,o.hatC||'#e8dcc4'); r(hx-1,hdT-4,hdW+2,3,o.hatC||'#e8dcc4');
                        r(hx-1,hdT-2,hdW+2,1,'#6b4426'); }
  if(o.hat==='flat'){                                     // flat brim, worn dead level
    const hc = o.hatC || '#1a1620';
    r(hx-1, hdT-5, hdW+2, 5, hc);
    r(hx-1, hdT-5, hdW+2, 1, shade(hc, .28));
    r(hx-5, hdT-1, hdW+7, 2, hc);
    r(hx-5, hdT-1, hdW+7, 1, shade(hc, .16));
    px(hx+1, hdT-3, P.gold);
  }
  return { headTop: hdT, headX: hx, headW: hdW, torsoTop: torT };
}

/* ---------------------------------------------------------------------------
   PORTRAITS.
   The world sprites are ~40px tall and there is no room in them for a face.
   Portraits are where a character actually gets to look like somebody, so they
   are drawn bigger and, for the cast who earn it, by hand.

   The technique: draw into a 44x52 buffer at 1:1 using real curves — ellipses
   and arcs, which rects cannot fake — then harden every edge to full alpha and
   snap every colour to a fixed palette. Smooth tools, limited-palette pixel-art
   output. The result is cached per expression, so the per-frame cost is a blit.
   --------------------------------------------------------------------------- */
const PW = 44, PH = 52;

function quantize(ctx, palette){
  const id = ctx.getImageData(0, 0, PW, PH), d = id.data;
  for(let i = 0; i < d.length; i += 4){
    if(d[i+3] < 110){ d[i+3] = 0; continue; }
    d[i+3] = 255;
    let best = palette[0], bd = 1e9;
    for(const c of palette){
      const dr = d[i]-c[0], dg = d[i+1]-c[1], db = d[i+2]-c[2];
      const dist = dr*dr + dg*dg + db*db;
      if(dist < bd){ bd = dist; best = c; }
    }
    d[i] = best[0]; d[i+1] = best[1]; d[i+2] = best[2];
  }
  ctx.putImageData(id, 0, 0);
}
const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function ell(c, x, y, rx, ry, col){
  c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill();
}
function ring(c, x, y, r, w, col){
  c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.stroke();
}

/* ---- Madame LaRue -------------------------------------------------------
   Storm of black curls, gold at every opportunity, and a look that is already
   pricing you. Red with a white neckline, coins at the brow and the throat. */
const LARUE_PAL = ['#170e28','#2c1e4e','#3d2c66','#5a4184','#7a5aa8',
                   '#5e3520','#8a5433','#a97048','#c68a5c','#e0ab7e',
                   '#f2e4d4','#241a14','#7a1f3a','#c02a4e','#e8547a',
                   '#ffc23d','#c98a1a','#8e1e33','#c4304a','#f5e6d3'].map(rgb);

function paintLaRue(c, blink){
  c.clearRect(0, 0, PW, PH);
  const CX = 22;
  const SKN = '#8a5433', LIT = '#a97048', SHD = '#5e3520', HI = '#c68a5c';

  /* hair: a storm of it, but framing the face rather than swallowing it */
  ell(c, CX, 20, 21, 20, '#2c1e4e');
  ell(c, 6, 30, 8, 13, '#2c1e4e');   ell(c, 38, 30, 8, 13, '#2c1e4e');
  ell(c, 8, 42, 6, 7,  '#2c1e4e');   ell(c, 36, 42, 6, 7,  '#2c1e4e');
  for(const [x,y] of [[13,13],[31,13],[6,20],[38,20],[22,6],[6,34],[38,34],[16,41],[28,41]])
    ell(c, x, y, 3.6, 3.6, '#170e28');                   // shadow between the curls
  for(const [x,y,r] of [[4,16,4],[8,8,4.5],[15,4,4.5],[29,4,4.5],[36,8,4.5],[40,16,4],
                        [3,27,3.5],[41,27,3.5],[5,37,3.5],[39,37,3.5],[10,45,3.5],[34,45,3.5]])
    ell(c, x, y, r, r, '#3d2c66');                       // ringlets catch the edge
  for(const [x,y,r] of [[7,11,2.2],[16,3,2.4],[28,3,2.2],[37,11,2.2],[3,22,1.8],[41,22,1.8],
                        [6,38,1.8],[38,38,1.8]])
    ell(c, x, y, r, r, '#5a4184');
  ell(c, 12, 6, 1.6, 1.1, '#7a5aa8');  ell(c, 32, 6, 1.4, 1.1, '#7a5aa8');

  /* face — big enough to have features */
  ell(c, CX, 23, 10, 12, SKN);
  ell(c, CX, 26, 9, 9, SKN);
  ell(c, CX-3.5, 19, 5, 5.5, LIT);
  ell(c, CX-4.5, 17, 2.8, 2.4, HI);
  ell(c, CX+6.5, 23, 3, 6.5, SHD);
  ell(c, CX, 33.5, 4, 1.6, SHD);
  ell(c, 12.5, 24, 1.6, 2.2, SHD);  ell(c, 31.5, 24, 1.6, 2.2, SHD);   // ears
  c.fillStyle = '#ffc23d'; c.fillRect(12, 24, 1, 1); c.fillRect(31, 24, 1, 1);

  /* neck and shoulders */
  c.fillStyle = SHD; c.fillRect(18, 34, 8, 7);
  c.fillStyle = SKN;  c.fillRect(18, 35, 5, 6);
  ell(c, CX, 40, 6, 3, SKN);
  ell(c, CX, 34.5, 4.5, 1.2, '#4a2818');          // the line under the jaw
  ell(c, 11, 47, 10, 7, SKN);  ell(c, 33, 47, 10, 7, SKN);
  ell(c, 12, 45, 6, 3, LIT);

  /* the front of the hair: a crown and two curls at the temples, no more */
  ell(c, CX, 8, 12, 6, '#2c1e4e');
  ell(c, 9.5, 19, 4, 9, '#2c1e4e');     ell(c, 34.5, 19, 4, 9, '#2c1e4e');
  ell(c, 10.5, 28, 3, 4.5, '#2c1e4e');  ell(c, 33.5, 28, 3, 4.5, '#2c1e4e');
  ell(c, CX-5, 5.5, 4, 2.2, '#3d2c66'); ell(c, CX+4, 5, 3.4, 2, '#3d2c66');
  ell(c, CX-6, 4.5, 2, 1.2, '#5a4184');
  ell(c, 10, 14, 2, 2.6, '#170e28');    ell(c, 34, 14, 2, 2.6, '#170e28');

  /* brows, eyes, nose, mouth */
  c.fillStyle = '#140a1e';
  c.fillRect(15, 17, 6, 1); c.fillRect(14, 18, 2, 1);
  c.fillRect(23, 17, 6, 1); c.fillRect(28, 18, 2, 1);
  if(blink){
    c.fillStyle = SHD; c.fillRect(15, 21, 6, 1); c.fillRect(23, 21, 6, 1);
    c.fillStyle = '#140a1e'; c.fillRect(14, 20, 8, 1); c.fillRect(22, 20, 8, 1);
  } else {
    ell(c, 17.8, 21.5, 3, 2.2, '#f2e4d4');  ell(c, 26.2, 21.5, 3, 2.2, '#f2e4d4');
    ell(c, 18.2, 21.7, 1.8, 1.8, '#241a14'); ell(c, 26.6, 21.7, 1.8, 1.8, '#241a14');
    c.fillStyle = '#f5e6d3'; c.fillRect(17, 20, 1, 1); c.fillRect(25, 20, 1, 1);
    c.fillStyle = '#140a1e';
    c.fillRect(14, 19, 8, 1); c.fillRect(23, 19, 8, 1);   // kohl
    c.fillRect(13, 20, 1, 1); c.fillRect(31, 20, 1, 1);   // and the flick
  }
  ell(c, CX+0.5, 25.5, 1.5, 2.2, SHD);
  c.fillStyle = HI; c.fillRect(20, 24, 1, 2);
  ell(c, CX, 30, 3.2, 1.6, '#c02a4e');
  ell(c, CX-0.5, 29.3, 2.2, 0.8, '#e8547a');
  c.fillStyle = '#7a1f3a'; c.fillRect(19, 30.5, 6, 1);

  /* gold, everywhere it can be got away with */
  c.fillStyle = '#ffc23d';
  for(let x = 14; x <= 30; x += 2) c.fillRect(x, 12, 1, 1);      // a chain, not a bar
  for(const x of [15, 22, 29]) ell(c, x, 12.5, 1.3, 1.3, '#ffc23d');
  ell(c, CX, 14.5, 1.1, 1.1, '#ffc23d');
  ring(c, 9, 27, 3.6, 1.5, '#ffc23d');  ring(c, 35, 27, 3.6, 1.5, '#ffc23d');
  ring(c, 9, 27, 3.6, 0.5, '#c98a1a');  ring(c, 35, 27, 3.6, 0.5, '#c98a1a');
  c.strokeStyle = '#ffc23d'; c.lineWidth = 1;
  c.beginPath(); c.arc(CX, 34, 7, 0.2*Math.PI, 0.8*Math.PI); c.stroke();
  for(const [x,y] of [[17,39],[22,40.5],[27,39]]){
    ell(c, x, y, 1.5, 1.5, '#ffc23d'); ell(c, x+0.4, y+0.4, 0.6, 0.6, '#c98a1a');
  }

  /* red, with the white neckline */
  c.fillStyle = '#c4304a';
  c.beginPath(); c.moveTo(0, PH); c.lineTo(2, 45); c.lineTo(13, 42.5);
  c.lineTo(CX, 47); c.lineTo(31, 42.5); c.lineTo(42, 45); c.lineTo(PW, PH); c.closePath(); c.fill();
  c.fillStyle = '#8e1e33';
  c.beginPath(); c.moveTo(31, 42.5); c.lineTo(42, 45); c.lineTo(PW, PH);
  c.lineTo(35, PH); c.closePath(); c.fill();
  c.strokeStyle = '#f5e6d3'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(12, 42); c.lineTo(CX, 46.5); c.lineTo(32, 42); c.stroke();
  c.fillStyle = '#f5e6d3'; c.fillRect(0, 44, 4, 2); c.fillRect(40, 44, 4, 2);
}

const _portCache = new Map();
function larueBuffer(blink){
  const key = 'larue' + (blink ? 1 : 0);
  let b = _portCache.get(key);
  if(b) return b;
  b = offscreen(PW, PH);
  const c = b.getContext('2d');
  paintLaRue(c, blink);
  quantize(c, LARUE_PAL);
  _portCache.set(key, b);
  return b;
}
/* ---- Chip Winthrop ------------------------------------------------------
   Drawn harder than the others on purpose: angular jaw, big anime eyes with a
   catchlight, shades pushed up on the brim so nothing is between you and him,
   black flat cap, and a mesh shirt doing almost no work at all. */
const CHIP_PAL = ['#0e0a14','#1a1620','#2e2836','#4a4454','#6e6880',
                  '#a86f45','#d99a63','#f2bb85','#ffd6a8','#7a4a28','#4a2a10',
                  '#a8873a','#d8b45a','#f2dc9a','#fff4c4',
                  '#f2e4d4','#1e3a5c','#4a7ab0','#8ec4f0',
                  '#8e3a4a','#c85a6a','#ffc23d','#f5e6d3'].map(rgb);

function paintChip(c, blink){
  c.clearRect(0, 0, PW, PH);
  const CX = 22;
  const SKN = '#d99a63', LIT = '#f2bb85', SHD = '#a86f45', HI = '#ffd6a8', DEEP = '#7a4a28';

  /* face first — angular, and given room to be a face */
  c.fillStyle = SKN;
  c.beginPath();
  c.moveTo(12, 17); c.lineTo(32, 17); c.lineTo(31.5, 28);
  c.lineTo(25, 36); c.lineTo(19, 36); c.lineTo(12.5, 28); c.closePath(); c.fill();
  ell(c, CX, 24, 9.5, 8.5, SKN);
  ell(c, CX-4, 22, 5, 6, LIT);
  ell(c, CX-5, 20, 2.6, 2.2, HI);
  c.fillStyle = SHD;
  c.beginPath(); c.moveTo(31, 19); c.lineTo(32, 28); c.lineTo(25, 36);
  c.lineTo(CX+4, 25); c.closePath(); c.fill();
  ell(c, CX, 34, 4.2, 2.2, SHD);
  c.fillStyle = DEEP; c.fillRect(15, 30.5, 5, 1); c.fillRect(25, 30.5, 5, 1);

  /* neck, and a chest the shirt is not covering */
  c.fillStyle = SHD; c.fillRect(17, 35, 10, 8);
  c.fillStyle = SKN; c.fillRect(17, 36, 7, 7);
  ell(c, CX, 43, 7.5, 3.5, SKN);
  ell(c, 10, 48, 12, 8, SKN);  ell(c, 34, 48, 12, 8, SKN);
  ell(c, 11, 46, 8, 3.5, LIT);

  /* the mesh: dark, fine, and doing almost nothing */
  c.fillStyle = '#1a1620';
  for(let y = 42; y < PH; y++)
    for(let x = 0; x < PW; x++)
      if(((x + y) % 3 === 0) && !(x > 17 && x < 27 && y < 49)) c.fillRect(x, y, 1, 1);
  c.fillStyle = '#2e2836';
  c.fillRect(0, 42, PW, 1);
  c.beginPath(); c.moveTo(14, 42); c.lineTo(18, 52); c.lineTo(15, 52); c.lineTo(11, 42);
  c.closePath(); c.fill();
  c.beginPath(); c.moveTo(30, 42); c.lineTo(26, 52); c.lineTo(29, 52); c.lineTo(33, 42);
  c.closePath(); c.fill();
  ell(c, CX, 45, 3.2, 1.4, '#ffc23d');
  ell(c, CX, 45.4, 1.2, 0.6, '#a8873a');

  /* brows and the eyes, which are the whole point of the shot */
  c.fillStyle = '#4a2a10';
  c.fillRect(13, 20, 8, 2); c.fillRect(23, 20, 8, 2);
  c.fillStyle = '#7a4a28'; c.fillRect(13, 20, 8, 1); c.fillRect(23, 20, 8, 1);
  if(blink){
    c.fillStyle = SHD; c.fillRect(14, 25, 7, 1); c.fillRect(24, 25, 7, 1);
    c.fillStyle = '#0e0a14'; c.fillRect(13, 24, 8, 1); c.fillRect(23, 24, 8, 1);
  } else {
    ell(c, 17.4, 25, 3.6, 2.8, '#f2e4d4');  ell(c, 26.6, 25, 3.6, 2.8, '#f2e4d4');
    ell(c, 17.8, 25.2, 2.2, 2.5, '#1e3a5c'); ell(c, 27, 25.2, 2.2, 2.5, '#1e3a5c');
    ell(c, 17.8, 25.6, 1.3, 1.6, '#4a7ab0'); ell(c, 27, 25.6, 1.3, 1.6, '#4a7ab0');
    c.fillStyle = '#8ec4f0'; c.fillRect(16, 24, 2, 1); c.fillRect(25, 24, 2, 1);
    c.fillStyle = '#f5e6d3'; c.fillRect(19, 26, 1, 1); c.fillRect(28, 26, 1, 1);
    c.fillStyle = '#0e0a14';
    c.fillRect(13, 23, 9, 1); c.fillRect(23, 23, 9, 1);
    c.fillRect(12, 24, 1, 1); c.fillRect(32, 24, 1, 1);
  }
  c.fillStyle = SHD; c.fillRect(CX, 27, 2, 3);
  c.fillStyle = HI;  c.fillRect(CX-1, 28, 1, 2);

  /* the smirk — one side only, always the same side */
  c.fillStyle = '#8e3a4a';
  c.fillRect(18, 32.5, 8, 1); c.fillRect(25, 31.5, 2, 1);
  c.fillStyle = '#c85a6a'; c.fillRect(19, 31.5, 5, 1);

  /* blond fringe, then the cap dead level on top of it */
  c.fillStyle = '#d8b45a';
  c.fillRect(11, 16, 22, 2);
  c.fillStyle = '#f2dc9a'; c.fillRect(13, 16, 5, 1); c.fillRect(24, 16, 4, 1);
  c.fillStyle = '#a8873a'; c.fillRect(11, 17, 22, 1);
  ell(c, 10, 20, 2.4, 3.5, '#d8b45a');  ell(c, 34, 20, 2.4, 3.5, '#d8b45a');

  ell(c, CX, 9, 12.5, 6, '#1a1620');
  c.fillStyle = '#1a1620'; c.fillRect(9, 9, 26, 5);
  c.fillStyle = '#2e2836'; c.fillRect(4, 13, 36, 3);      // the flat brim
  c.fillStyle = '#4a4454'; c.fillRect(4, 13, 36, 1);
  c.fillStyle = '#0e0a14'; c.fillRect(4, 15, 36, 1);
  ell(c, CX-4, 5.5, 6, 2.2, '#2e2836');
  c.fillStyle = '#6e6880'; c.fillRect(11, 6, 7, 1);
  c.fillStyle = '#ffc23d'; c.fillRect(19, 10, 6, 2);      // a monogram, obviously
  c.fillStyle = '#0e0a14'; c.fillRect(21, 10, 2, 2);
}
function chipBuffer(blink){
  const key = 'chip' + (blink ? 1 : 0);
  let b = _portCache.get(key);
  if(b) return b;
  b = offscreen(PW, PH);
  const c = b.getContext('2d');
  paintChip(c, blink);
  quantize(c, CHIP_PAL);
  _portCache.set(key, b);
  return b;
}
const BESPOKE = { larue: larueBuffer, chip: chipBuffer };

/* ---- everyone else, from their look parameters, same technique ---------- */
function paintGeneric(c, o, blink){
  c.clearRect(0, 0, PW, PH);
  const sk = SKIN[o.skin||'tan'], CX = 22;
  const hc = o.hairC || '#3b2416', hc2 = o.hairC2 || '#6b4426';
  const hcD = shade(hc, -0.35), hcL = shade(hc2, 0.18);
  const style = o.hair || 'blowout';

  /* hair behind the head */
  switch(style){
    case 'perm':    ell(c, CX, 21, 20, 18, hc);
                    for(const [x,y,r] of [[6,18,5],[10,9,5],[34,9,5],[38,18,5],[5,29,4],[39,29,4]])
                      ell(c, x, y, r, r, hc2);
                    break;
    case 'blowout': ell(c, CX, 18, 18, 15, hc);
                    ell(c, 7, 25, 6, 10, hc); ell(c, 37, 25, 6, 10, hc);
                    ell(c, 11, 10, 5, 4, hc2); ell(c, 33, 10, 5, 4, hc2); break;
    case 'spikes':  ell(c, CX, 15, 14, 9, hc);
                    for(let i = 0; i < 7; i++){
                      const x = 9 + i*4.5, h = i % 2 ? 11 : 7;
                      c.fillStyle = hc; c.beginPath(); c.moveTo(x-2.6, 12);
                      c.lineTo(x, 12-h); c.lineTo(x+2.6, 12); c.closePath(); c.fill();
                    } break;
    case 'ponytail':ell(c, CX, 15, 13, 9, hc);
                    ell(c, 36, 26, 5, 9, hc); ell(c, 37, 35, 4, 5, hc); break;
    case 'bun':     ell(c, CX, 15, 13, 9, hc); ell(c, 35, 12, 6, 6, hc);
                    ell(c, 34, 11, 2.4, 2.4, hc2); break;
    case 'pomp':    ell(c, CX, 14, 13, 9, hc); ell(c, CX, 6.5, 9, 5.5, hc);
                    ell(c, CX-3, 5, 4, 2.4, hc2); break;
    case 'turban':  ell(c, CX, 13, 15, 10, hc); break;
    case 'cap':     ell(c, CX, 13, 14, 10, hc); break;
    case 'bald':    break;
    default:        ell(c, CX, 16, 14, 11, hc);
  }

  /* face */
  ell(c, CX, 24, 8.6, 10.4, sk.s);
  ell(c, CX, 28, 7.2, 8.2, sk.s);

/* ---------- 1b. TEXT: real fonts, thresholded to 1-bit pixel text --------- */
const FONT = { sm:'8px Silkscreen, monospace', bg:'16px Silkscreen, monospace',
               dlg:'16px VT323, monospace', big:'24px Silkscreen, monospace' };
const _measure = offscreen(4,4).getContext('2d');
const _tcache  = new Map();
function scaleFont(font, k){
  return k === 1 ? font
    : font.replace(/^(\d+(?:\.\d+)?)px/, (m,v) => (Math.round(parseFloat(v)*k)) + 'px');
}

function hex2rgb(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

function textW(str, font){
  _measure.font = scaleFont(font||FONT.sm, TXSC);
  return _measure.measureText(str).width / TXSC;          // logical width
}

function textCanvas(str, font, color){
  const k = TXSC, key = k+'|'+font+'|'+color+'|'+str;
  const hit = _tcache.get(key); if(hit) return hit;
  font = scaleFont(font, k);
  _measure.font = font;
  const w = Math.max(1, Math.ceil(_measure.measureText(str).width) + 2*k),
        h = parseInt(font,10) + 7*k;
  const oc = offscreen(w,h), x = oc.getContext('2d');
  x.font = font; x.textBaseline = 'top'; x.fillStyle = '#fff'; x.fillText(str, k, 3*k);
  const id = x.getImageData(0,0,w,h), d = id.data, c = hex2rgb(color);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3] > 108){ d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255; } else d[i+3]=0;
  }
  x.putImageData(id,0,0);
  if(_tcache.size > 1200) _tcache.clear();
  _tcache.set(key, oc); return oc;
}
function text(str, x, y, color, font){
  const c = textCanvas(str, font||FONT.sm, color||P.bone);
  const k = TXSC;
  g.drawImage(c, x|0, y|0, c.width/k, c.height/k);
  return c.width/k;
}
function textC(str, cx, y, color, font){
  const f = font||FONT.sm; return text(str, Math.round(cx - textW(str,f)/2), y, color, f);
}
function wrap(str, font, maxw){
  const words = String(str).split(' '), lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(textW(test,font) <= maxw) cur = test;
    else { if(cur) lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur); return lines;
}

      if(i>3 && i%2===0){ px(px1, py1-1, frondC); px(px1+1, py1+1, frondC); }

  r(tx-1, ty-1, 5, 3, frondC);

/* ---------- 3. AUDIO: adaptive synthwave, generated live ------------------ */
/* Stems crossfade against the player's stat lean (§8): the arp carries Money,
   a distorted saw carries Fighting, pad + lead carry Charm. Nothing is a file. */
const Audio_ = (() => {
  let ctx=null, master=null, buses={}, noiseBuf=null, started=false;
  let musicOn=true, sfxOn=true, musicGain=null, sfxGain=null;
  let timer=null, step=0, nextTime=0, scene='title', amb=null, ambGain=null;
  let lean = { money:.33, fight:.33, charm:.33 };
  const BPM = 106, SPB = 60/BPM/4;                   // sixteenth notes

  /* Eight bars rather than four, and a texture that changes every time round,
     so the loop stops announcing itself after a minute. */
  const CH = {
    Am:{ root:45, tones:[57,60,64] }, F:{ root:41, tones:[53,57,60] },
    C: { root:48, tones:[52,55,60] }, G:{ root:43, tones:[50,55,59] },
    Dm:{ root:38, tones:[53,57,62] }, E:{ root:40, tones:[52,56,59] }
  };
  const LOOP = ['Am','F','C','G','Am','F','Dm','E'];
  const ARPS = [[0,1,2,1],[0,2,1,2],[2,1,0,1],[0,1,2,3],[2,0,1,0],[0,3,2,1]];
  /* statement, melody, breathe, push */
  const SECT = [ { arp:1,   lead:0,  grit:1,   perc:1,    pad:1    },
                 { arp:1,   lead:1,  grit:.7,  perc:1,    pad:.85  },
                 { arp:.3,  lead:.5, grit:.15, perc:.3,   pad:1.35 },
                 { arp:1.2, lead:1,  grit:1.2, perc:1.15, pad:.7   } ];
  /* an eight-bar phrase: [bar, sixteenth, midi, beats] */
  const MELODY = [ [0,0,64,.55],[0,8,60,.40],
                   [1,0,65,.80],
                   [2,0,64,.35],[2,6,62,.35],[2,12,60,.50],
                   [3,0,59,1.00],
                   [4,0,64,.50],[4,8,67,.50],
                   [5,0,69,.80],
                   [6,0,67,.35],[6,6,65,.35],[6,12,64,.50],
                   [7,0,57,1.10] ];
  const mtof = m => 440 * Math.pow(2, (m-69)/12);
  let section = 0, lastSection = -1;

  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = musicOn ? 1 : 0;
    sfxGain   = ctx.createGain(); sfxGain.gain.value   = sfxOn   ? 1 : 0;
    musicGain.connect(master); sfxGain.connect(master);
    for(const n of ['bass','pad','arp','lead','grit','perc']){
      const gn = ctx.createGain(); gn.gain.value = 0; gn.connect(musicGain); buses[n] = gn;
    }
    buses.sfx = ctx.createGain(); buses.sfx.gain.value = 0.9; buses.sfx.connect(sfxGain);
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime+1.2);
  }

  function voice(type, freq, when, dur, bus, vol, opts){
    if(!ctx) return;
    opts = opts||{};
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, when);
    if(opts.detune) o.detune.value = opts.detune;
    if(opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,opts.slideTo), when+dur);
    let node = o;
    if(opts.filter){
      const f = ctx.createBiquadFilter();
      f.type = opts.filter; f.frequency.setValueAtTime(opts.cut||1200, when);
      f.Q.value = opts.q||1;
      if(opts.cutTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,opts.cutTo), when+dur);
      o.connect(f); node = f;
    }
    const a = opts.atk!==undefined ? opts.atk : 0.008;
    gn.gain.setValueAtTime(0.0001, when);
    gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol), when+a);
    gn.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    node.connect(gn); gn.connect(buses[bus]||buses.sfx);
    o.start(when); o.stop(when+dur+0.03);
  }
  function noise(when, dur, vol, cut, cutTo, bus){
    if(!ctx) return;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(cut, when);
    if(cutTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,cutTo), when+dur);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(vol, when);
    gn.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    s.connect(f); f.connect(gn); gn.connect(buses[bus]||buses.sfx);
    s.start(when); s.stop(when+dur+0.02);
  }

  /* stem levels follow the build AND the current section — the adaptive part */
  function mix(){
    if(!ctx) return;
    const T = ctx.currentTime, R = 1.4, sx = SECT[section];
    const on = (name, v) => buses[name].gain.setTargetAtTime(Math.max(0,v), T, R/3);
    const s = { title:{b:.20,p:.34,a:.00,l:.06,g:.00,pc:.00},
                create:{b:.24,p:.30,a:.10,l:.10,g:.02,pc:.05},
                play:{b:.30,p:.22,a:.16,l:.13,g:.08,pc:.14},
                tense:{b:.34,p:.14,a:.10,l:.06,g:.22,pc:.18},
                win:{b:.30,p:.30,a:.26,l:.22,g:.06,pc:.16} }[scene] || {};
    const fixed = scene === 'title' || scene === 'create';
    on('bass', s.b);
    on('pad',  s.p * (0.7 + lean.charm*1.1) * (fixed?1:sx.pad));
    on('arp',  s.a * (0.4 + lean.money*2.0) * (fixed?1:sx.arp));
    on('lead', s.l * (0.4 + lean.charm*1.8) * (fixed?1:sx.lead));
    on('grit', s.g * (0.3 + lean.fight*2.2) * (fixed?1:sx.grit));
    on('perc', s.pc * (0.7 + lean.fight*0.9) * (fixed?1:sx.perc));
  }

  function tick(){
    if(!ctx) return;
    while(nextTime < ctx.currentTime + 0.18){
      const bar = (step>>4) % 8, six = step % 16, T = nextTime;
      const round = (step/128)|0;
      section = round % SECT.length;
      if(section !== lastSection){ lastSection = section; mix(); }
      const ch = CH[LOOP[bar]], sx = SECT[section];
      const cut = 780 + Math.sin(round*0.7 + bar*0.4)*260;     // slow filter drift

      if(six % 4 === 0){                                        // bass
        const oct = (section===3 && six===12) ? 12 : 0;
        voice('sawtooth', mtof(ch.root+oct), T, .30, 'bass', .5,
              { filter:'lowpass', cut:cut, cutTo:220, q:4 });
      }
      if(six === 0){                                            // pad
        for(const nn of ch.tones){
          voice('sawtooth', mtof(nn),    T, 1.8, 'pad', .16,
                { atk:.35, filter:'lowpass', cut:1500, q:.7 });
          voice('sawtooth', mtof(nn+12), T, 1.8, 'pad', .07,
                { atk:.4, detune:9, filter:'lowpass', cut:2200 });
        }
      }
      if(six % 2 === 0 && sx.arp > .2){                         // money arp
        const pat = ARPS[(round*3 + bar) % ARPS.length];
        const idx = pat[(step>>1) % 4];
        voice('square', mtof((idx < 3 ? ch.tones[idx] : ch.tones[0]+12) + 12), T, .13,
              'arp', .16, { filter:'lowpass', cut:3400, q:2 });
      }
      if((six === 4 || six === 12) && sx.grit > .2)             // fighting stabs
        voice('sawtooth', mtof(ch.root+12), T, .18, 'grit', .30,
              { filter:'lowpass', cut:2600, cutTo:500, q:7 });

      const fill = (bar === 7 && six >= 12 && section !== 2);
      if(six === 0 || (six === 10 && section !== 2) || (six === 6 && section === 3))
        voice('sine', 110, T, .17, 'perc', .55, { slideTo:44 });
      if(six === 8 || (six === 12 && section === 3)) noise(T, .13, .14, 4000, 900, 'perc');
      if(fill) noise(T, .07, .12 + (six-12)*.02, 5200, 1400, 'perc');
      if(six % 2 === 1 && !fill)
        noise(T, .035, (six===2||six===6||six===10||six===14) ? .075 : .045, 9000, 6000, 'perc');

      if(sx.lead > 0){                                          // the charm phrase
        for(const m of MELODY) if(m[0] === bar && m[1] === six){
          voice('triangle', mtof(m[2]+12), T, m[3]*0.5, 'lead', .24, { atk:.04 });
          voice('sawtooth', mtof(m[2]+12), T, m[3]*0.5, 'lead', .07,
                { atk:.06, detune:7, filter:'lowpass', cut:2400 });
        }
      }
      nextTime += SPB; step++;
    }
  }

  function ambience(kind){
    if(!ctx) return;
    if(amb){ try{ amb.stop(); }catch(e){} amb=null; }
    if(!kind) return;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter();
    const gn = ctx.createGain(); ambGain = gn;
    if(kind==='surf'){ f.type='lowpass'; f.frequency.value=520; gn.gain.value=.055; }
    else if(kind==='deep'){ f.type='lowpass'; f.frequency.value=280; gn.gain.value=.075; }
    else { f.type='bandpass'; f.frequency.value=900; gn.gain.value=.03; }
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.11; lg.gain.value = kind==='deep'?.03:.022;
    lfo.connect(lg); lg.connect(gn.gain); lfo.start();
    s.connect(f); f.connect(gn); gn.connect(musicGain);
    s.start(); amb = s;
  }

  const API = {
    start(){
      init(); if(!ctx || started) return;
      if(ctx.state === 'suspended') ctx.resume();
      started = true; nextTime = ctx.currentTime + 0.06;
      timer = setInterval(tick, 25); mix();
    },
    scene(s){ if(scene===s) return; scene = s; mix(); },
    lean(m,f,c){ const tot=Math.max(1,m+f+c); lean={money:m/tot,fight:f/tot,charm:c/tot}; mix(); },
    ambience,
    get musicOn(){ return musicOn; },
    get sfxOn(){ return sfxOn; },
    toggleMusic(){
      musicOn = !musicOn;
      if(musicGain) musicGain.gain.setTargetAtTime(musicOn?1:0, ctx.currentTime, .12);
      return musicOn;
    },
    toggleSfx(){
      sfxOn = !sfxOn;
      if(sfxGain) sfxGain.gain.setTargetAtTime(sfxOn?1:0, ctx.currentTime, .05);
      return sfxOn;
    },
    /* ---- SFX ---- */
    sfx(name){
      if(!ctx || !sfxOn) return;
      const T = ctx.currentTime + 0.01;
      switch(name){
        case 'click': voice('square', 1400, T, .035, 'sfx', .10); break;
        case 'walk':  noise(T, .05, .05, 1600, 500, 'sfx'); break;
        case 'coin':  voice('square', 988, T, .07, 'sfx', .20);
                      voice('square', 1319, T+.07, .16, 'sfx', .20); break;
        case 'cash':  [523,659,784,1047].forEach((f,i)=>
                        voice('square', f, T+i*.055, .16, 'sfx', .19));
                      noise(T, .06, .10, 5000, 1200, 'sfx'); break;
        case 'punch': noise(T, .17, .40, 1800, 90, 'sfx');
                      voice('sine', 180, T, .16, 'sfx', .34, { slideTo:48 }); break;
        case 'charm': [659,831,988,1319].forEach((f,i)=>
                        voice('triangle', f, T+i*.05, .42, 'sfx', .17, { atk:.02 })); break;
        case 'fail':  voice('sawtooth', 392, T, .42, 'sfx', .22,
                        { slideTo:120, filter:'lowpass', cut:1600, cutTo:300 }); break;
        case 'death': [233,220,208].forEach((f,i)=>
                        voice('sawtooth', f, T+i*.02, 1.5, 'sfx', .20,
                          { slideTo:f/3.6, filter:'lowpass', cut:1400, cutTo:180 }));
                      noise(T+.1, 1.0, .16, 900, 120, 'sfx'); break;
        case 'slots': for(let i=0;i<9;i++) voice('square', 900+i*40, T+i*.045, .03, 'sfx', .13); break;
        case 'shell': noise(T, .09, .13, 2600, 700, 'sfx'); break;
        case 'fanfare':[523,659,784,1047,1319].forEach((f,i)=>{
                        voice('square', f, T+i*.10, .5, 'sfx', .18);
                        voice('sawtooth', f/2, T+i*.10, .5, 'sfx', .09,
                          { filter:'lowpass', cut:2000 }); }); break;
        case 'deny':  voice('square', 220, T, .13, 'sfx', .16, { slideTo:150 }); break;
        case 'pickup':voice('triangle', 784, T, .09, 'sfx', .18);
                      voice('triangle', 1175, T+.06, .12, 'sfx', .16); break;
      }
    }
  };
  return API;
})();

/* ---- player movement ---- */
function walkTo(x, y, then){
  const p = GS.player, rm = ROOMS[GS.room];
  p.tx = clamp(x, rm.walk.x0, rm.walk.x1);
  p.ty = clamp(y, rm.walk.y0, rm.walk.y1);
  p.walking = true; p.then = then||null;
}
function updatePlayer(dt){
  const p = GS.player;
  if(!p.walking) { p.phase = 0; return; }
  const dx = p.tx-p.x, dy = p.ty-p.y, d = Math.hypot(dx,dy);
  const spd = 80 * dt;
  if(d <= spd){
    p.x = p.tx; p.y = p.ty; p.walking = false; p.phase = 0;
    const f = p.then; p.then = null; if(f) f();
  } else {
    p.x += dx/d*spd; p.y += dy/d*spd;
    p.phase += dt*11;
    if(Math.floor(p.phase/2.4) !== Math.floor((p.phase-dt*11)/2.4)) Audio_.sfx('walk');
  }
}
function playerDepth(){                       // a little depth scaling
  const rm = ROOMS[GS.room], t = (GS.player.y - rm.walk.y0)/Math.max(1,(rm.walk.y1-rm.walk.y0));
  return Math.round(t*5) - 2;
}

const DLG_MAX = 6;                        // lines per view before it flows on

function dlgLayout(m){
  const hasPort = !!m.look;
  const tx = hasPort ? PW + 14 : 12, tw = hasPort ? 294 - PW : 296;
  const nameH = m.speaker ? 10 : 0;
  const sub = m.sub || 0;
  const all = wrap(m.pages[m.i], FONT.dlg, tw);
  const onLast = m.i === m.pages.length-1;

  // choice rows wrap too, and each knows its own height
  let rows = null, chH = 0;
  if(m.choices && onLast){
    rows = m.choices.map(c => {
      const pre = c.tag ? c.tag + ' \u00b7 ' : '';
      const ls = wrap(pre + c.text, FONT.dlg, tw - 14);
      return { c, pre, lines:ls, h: ls.length*13 + 3 };
    });
    chH = rows.reduce((a,q)=>a+q.h, 0) + 6;
  }

  // shrink the body view until the box fits between the status bar and the verb bar
  let maxL = DLG_MAX, lines, more, h;
  for(;;){
    lines = all.slice(sub*maxL, sub*maxL + maxL);
    more  = (sub+1)*maxL < all.length;
    h = Math.max(hasPort ? PH + 12 : 46, 10 + nameH + lines.length*13 + (more ? 0 : chH) + 8);
    if(h <= 150 || maxL <= 2) break;
    maxL--;
  }
  const last = !more && onLast;
  const choices = (rows && !more) ? m.choices : null;
  const y = Math.max(14, 166 - h);
  return { hasPort, tx, tw, lines, more, last, nameH, choices,
           rows: (rows && !more) ? rows : null, chH, h, y,
           x:6, bw:308, chY: y + 6 + nameH + lines.length*13 + 4 };
}
function dlgHasMore(m){ const L = dlgLayout(m); return L.more; }

function drawDialogue(){
  const m = GS.msg; if(!m) return;
  const L = dlgLayout(m);

  g.globalAlpha = .93; r(L.x, L.y, L.bw, L.h, '#180d26'); g.globalAlpha = 1;
  r(L.x, L.y, L.bw, 1, P.hot); r(L.x, L.y+L.h-1, L.bw, 1, P.hot);
  r(L.x, L.y, 1, L.h, P.hot); r(L.x+L.bw-1, L.y, 1, L.h, P.hot);
  g.globalAlpha = .35; r(L.x+1, L.y+1, L.bw-2, 1, '#ff9ac8'); g.globalAlpha = 1;

  if(L.hasPort) drawPortrait(L.x+5, L.y+6, m.look, clock);
  let ty = L.y+6;
  if(m.speaker){ text(m.speaker.toUpperCase(), L.tx, ty, P.gold, FONT.sm); ty += L.nameH; }
  for(const ln of L.lines){ text(ln, L.tx, ty, P.bone, FONT.dlg); ty += 13; }

  if(L.rows){
    let cy = L.chY;
    for(const row of L.rows){
      const q = { x:L.tx-4, y:cy, w:L.tw+6, h:row.h };
      const hov = inRect(mouse,q) && row.c.enabled !== false;
      if(hov) r(q.x, q.y, q.w, q.h, 'rgba(255,46,136,.22)');

      cy += row.h;

  } else if(!L.last){
    if(Math.floor(clock/450)%2===0) text('\u25bc', L.x+L.bw-14, L.y+L.h-13, P.hot, FONT.dlg);

/* ---------- 4c. ROOM RENDER ---------------------------------------------- */
let clock = 0;
function hotspotsOf(room){ return ROOMS[room].hotspots.filter(h => !h.hidden || !h.hidden()); }
function hotspotAt(p){
  let best = null, bestArea = Infinity, bestPri = -1;
  for(const h of hotspotsOf(GS.room)){
    if(p.x>=h.x && p.x<h.x+h.w && p.y>=h.y && p.y<h.y+h.h){
      const pri = h.pri||0, a = h.w*h.h;       // a person beats the building behind them
      if(pri > bestPri || (pri === bestPri && a < bestArea)){ best = h; bestPri = pri; bestArea = a; }
    }
  }
  return best;
}
function drawRoom(t){
  g.drawImage(bakedRoom(GS.room), 0, 0);
  ROOMART[GS.room].live(t);
  const rm = ROOMS[GS.room];

  // entities sorted back-to-front
  const ents = [];
  for(const n of rm.npcs) if(!n.hidden || !n.hidden())
    ents.push({ y:n.y, draw:()=>{ if(n.behind) n.behind(t);
      drawPerson(n.x, n.y, n.look, t, 0); if(n.extra) n.extra(t); } });
  ents.push({ y:GS.player.y, draw:()=>{
    const o = Object.assign({}, GS.look, { size:playerDepth() });
    drawPerson(GS.player.x, GS.player.y, o, t, GS.player.walking?GS.player.phase:0); } });
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents) e.draw();

  if(rm.overlay) rm.overlay(t);

  // hover outline
  const hs = GS.msg ? null : hotspotAt(mouse);

    r(hs.x, hs.y, 1, hs.h, c); r(hs.x+hs.w-1, hs.y, 1, hs.h, c);
    g.globalAlpha = 1;
  }
  drawStatusBar();
  drawDialogue();
  drawVerbBar(hs ? hs.name : null);
}

const SHRUG = {
  look:['Nothing there worth the eye strain.','You look. Vanity Shores looks back, unimpressed.',
        'It is exactly as tacky up close.'],
  talk:['It says nothing. You respect that.','You are not yet desperate enough to talk to that.',
        'Talking to that is a Level 6 problem.'],
  use:['That does not work that way. Almost nothing here does.','You try. It does not take.',
       'No. But points for the attempt.'],
  take:['It is not yours. Yet.','You cannot carry that, and it would not suit you.',
        'Too big, too bolted down, or too watched.']
};
function shrug(verb){ const a=SHRUG[verb]||SHRUG.look; return a[(Math.random()*a.length)|0]; }

function doAction(hs, verb){
  if(hs.exit){
    if(verb==='look' && hs.desc){ narrate(hs.desc, { then:hs.go }); return; }
    if(verb==='talk'){ narrate('You do not need to ask its permission.', { then:hs.go }); return; }
    hs.go(); return;
  }
  const fn = hs[verb];
  if(GS.sel && verb==='use'){
    const item = GS.sel;
    if(hs.useItem){ const done = hs.useItem(item); GS.sel = null; if(done !== false) return; }
    GS.sel = null;
    narrate('You wave ' + ITEMS[item].name + ' at ' + hs.name + '. Nothing in the universe responds.');
    Audio_.sfx('deny'); return;
  }
  if(typeof fn === 'function'){ fn(); return; }
  if(typeof fn === 'string'){ narrate(fn); return; }
  Audio_.sfx('deny'); narrate(shrug(verb));
}
function clickScene(p){
  if(GS.msg){                                   // dialogue owns the click
    const L = dlgLayout(GS.msg);
    if(L.rows){
      let cy = L.chY;
      for(let i=0;i<L.rows.length;i++){
        if(inRect(p, { x:L.tx-4, y:cy, w:L.tw+6, h:L.rows[i].h })){ chooseOption(i); return; }
        cy += L.rows[i].h;
      }
      return;
    }
    advanceMsg(); return;
  }
  const hs = hotspotAt(p);
  if(hs){
    const ap = hs.approach;
    if(ap) walkTo(ap[0], ap[1], () => doAction(hs, GS.verb));
    else doAction(hs, GS.verb);
    return;
  }
  const rm = ROOMS[GS.room];
  if(p.y >= rm.walk.y0-14 && p.y <= BAR_Y){
    if(rm.danger && rm.danger(p)) return;
    walkTo(p.x, p.y);
  } else if(p.y < rm.walk.y0-14){
    if(rm.danger && rm.danger(p)) return;
    narrate('You cannot get there from here. Not in these shoes.');
  }
}

/* ---------------------------------------------------------------------------
   CUTAWAY.
   The grammar this genre actually runs on: the payoff happens off-screen and
   the camera looks at something else. It is funnier than showing it, it keeps
   the game shippable anywhere, and it costs four pixels of animation instead of
   a sprite sheet. A cutaway is a framed vignette plus captions; click through.
   --------------------------------------------------------------------------- */
function cutaway(paint, pages, then){
  GS.cut = { paint, pages, i:0, then, t0:clock };
  GS.msg = null; GS.scene = 'cutaway';
  Audio_.scene('win');
}
/* A face, filling the screen, with the room drawn out from behind it. Used when
   somebody gets close enough that the scene is their expression. */
function closeup(look, pages, then){
  GS.cut = { look, pages, i:0, then, t0:clock };
  GS.msg = null; GS.scene = 'cutaway';
}
function drawCloseup(t){
  r(0, 0, W, 200, '#08040e');
  const cx = 160, cy = 62;
  g.strokeStyle = 'rgba(255,46,136,.40)'; g.lineWidth = 1;
  for(let i = 0; i < 30; i++){
    const a = i/30*Math.PI*2 + (REDUCED ? 0 : t/3400);
    const r0 = 48 + (i % 3)*8;
    g.beginPath();
    g.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0);
    g.lineTo(cx + Math.cos(a)*280, cy + Math.sin(a)*280);
    g.stroke();
  }
  g.globalAlpha = .40; r(0, 0, W, 200, '#180624'); g.globalAlpha = 1;

  const b = portraitBuffer(GS.cut.look, false);
  const w2 = PW*2, h2 = PH*2, bx = cx - w2/2, by = 8;
  r(bx-2, by-2, w2+4, h2+4, '#241134');
  g.drawImage(b, 0, 0, PW, PH, bx, by, w2, h2);
  r(bx-2, by-2, w2+4, 1, P.hot); r(bx-2, by+h2+1, w2+4, 1, P.hot);
  r(bx-2, by-2, 1, h2+4, P.hot); r(bx+w2+1, by-2, 1, h2+4, P.hot);

  const lines = wrap(GS.cut.pages[GS.cut.i], FONT.dlg, 288);
  const lh = lines.length > 3 ? 11 : 13;
  let ty = 178 - lines.length*lh;
  for(const ln of lines){ textC(ln, 160, ty, P.bone, FONT.dlg); ty += lh; }
  if(Math.floor(t/500)%2 === 0)
    textC(GS.cut.i < GS.cut.pages.length-1 ? 'MORE' : 'CLICK TO GO BACK',
          160, 190, '#6b4d8a', FONT.sm);
}

function drawCutaway(t){
  if(GS.cut.look) return drawCloseup(t);
  r(0, 0, W, 200, '#08040e');
  const bx = 80, by = 18, bw = 160, bh = 82;
  g.save();
  g.beginPath(); g.rect(bx, by, bw, bh); g.clip();
  GS.cut.paint(bx, by, bw, bh, t);
  g.restore();
  r(bx-1, by-1, bw+2, 1, P.hot);   r(bx-1, by+bh, bw+2, 1, P.hot);
  r(bx-1, by-1, 1, bh+2, P.hot);   r(bx+bw, by-1, 1, bh+2, P.hot);
  g.globalAlpha = .5;
  r(bx-3, by-3, bw+6, 1, '#5a2a72'); r(bx-3, by+bh+2, bw+6, 1, '#5a2a72');
  g.globalAlpha = 1;

  const lines = wrap(GS.cut.pages[GS.cut.i], FONT.dlg, 292);
  const lh = lines.length > 4 ? 11 : 13;                  // whatever the font does
  let ty = 172 - lines.length*lh;
  for(const ln of lines){ textC(ln, 160, ty, P.bone, FONT.dlg); ty += lh; }
  if(Math.floor(t/500)%2 === 0)
    textC(GS.cut.i < GS.cut.pages.length-1 ? 'MORE' : 'CLICK TO GO BACK',
          160, 186, '#6b4d8a', FONT.sm);
}
function advanceCutaway(){
  const c = GS.cut;
  if(c.i < c.pages.length-1){ c.i++; Audio_.sfx('click'); return; }
  GS.cut = null; GS.scene = 'play'; Audio_.scene('play');
  if(c.then) c.then();
}

/* ---------- 5d. SCRIPTED SCENES ------------------------------------------ */
/* Every beat offers a build-specific route and a route anyone can take. The
   build never locks you out of Level 1 — it changes what the win looks like. */
const GATE = 38;                       // default stat needed to open a build route

/* ---------------------------------------------------------------------------
   THE ECONOMY, IN ONE TABLE.
   Every figure Level 1 can move is declared here, in cents, so the balance can
   be read, simulated and regenerated without anybody reading dialogue. Routes
   are 'base' (open to any build) and the three build routes. Change a number
   here and the game, the docs and the balance simulation all move together.
   --------------------------------------------------------------------------- */
const ECONOMY = {
  startPerMoneyPoint: 10,              // opening purse = Money stat x this
  stakeLine: 10000,                    // enough money to make Chip look at you
  monteStake: 5000,                    // cost to sit at the shell game
  encoreDecay: 0.5,                    // each encore plays to a thinner crowd
  encoreFloor: 500,                    // ...but never for nothing
  earn: {
    brendaGift:   { base:0,     charm:500,   money:500,   fight:0     },
    gilAloe:      { base:2000,  charm:3000,  money:2500,  fight:2000  },
    dickieSplit:  { base:2500,  charm:4500,  money:4000,  fight:3000  },
    dickieEncore: { base:1500,  charm:2000,  money:1500,  fight:1500  },
    monteWin:     { base:10000, charm:17500, money:15000, fight:12000 }
  }
};
/* Every stat check in the level, by name, so they can be listed and tuned
   individually. RULE: no gate may be the only route past a required beat. */
const GATES = {
  chipIntro:    { stat:'any',   need:GATE, opens:'a build-specific opening line with Chip' },
  brendaPitch:  { stat:'any',   need:GATE, opens:'the good bag in one pass instead of two' },
  gilPrice:     { stat:'any',   need:GATE, opens:'a better price for the aloe' },
  dickieSplit:  { stat:'any',   need:GATE, opens:'a bigger cut of the tip jar' },
  dickieEncore: { stat:'charm', need:GATE, opens:'a bigger first encore before the decay bites' },
  monteTable:   { stat:'any',   need:GATE, opens:'a bigger take at the shell game' },
  chipShowdown: { stat:'any',   need:GATE, opens:'a build-specific way to make Chip take the money' }
};
const gateNeed = k => (GATES[k] ? GATES[k].need : GATE);
const gated = (k, stat) => S()[stat] >= gateNeed(k);
const earn  = (k, route) => ECONOMY.earn[k][route] !== undefined
                          ? ECONOMY.earn[k][route] : ECONOMY.earn[k].base;

/* ---------------------------------------------------------------------------
   INTRIGUE.
   Attraction is tracked, never resolved — nothing in Act 1 is winnable (§5.4
   gates low-tier conquests to Act 2 and the rest to Act 3). What the player
   builds here is a number the later acts read, and a reason to talk to somebody
   twice when the puzzle does not require it.
   --------------------------------------------------------------------------- */
const HEAT_TIERS = [[80,'a problem for later'],[60,'circling'],[35,'interested'],
                    [15,'noticed you'],[1,'clocked you']];
const heatOf   = who => GS.heat[who] || 0;
function heatTier(v){ for(const [n,label] of HEAT_TIERS) if(v >= n) return label; return null; }
function addHeat(who, amt){
  GS.heat[who] = clamp(heatOf(who) + amt, 0, 100);
  saveGame();
}
/* Repeat flirtation is capped so it cannot be farmed for a number. */
function flirtBeat(who, beats, perBeat){
  const key = who + 'Flirt';
  const i = GS.flags[key] || 0;
  if(i < beats.length){
    GS.flags[key] = i + 1;
    addHeat(who, perBeat);
    return beats[i];
  }
  return null;
}
const you = () => GS.name || 'you';

/* Three beats he does not have to give you. Each one costs him something. */
const CHIP_BEATS = [
  ['He has moved four feet along the car so that he is facing you now, which he would describe, '+
   'if anybody asked him, as a coincidence.',
   '"Do you know the worst thing about a town like this? Everybody wants the same six things."',
   '"You want them too. You just want them out loud. It is —" he goes looking for a word he can '+
   'afford "— unbecoming."',
   'He says the word to your mouth rather than your eyes. Then he notices that he has done it.'],
  ['"You are still here."',
   'He says it like an accusation. It arrives like a compliment. Both of you hear which one it '+
   'was, and neither of you does anything about that.',
   '"People wash up here every June and they are gone by the Fourth. I have a system. I do not '+
   'learn the names until August."',
   'A pause. "What was it again?"'],
  ['"There is a room at the top of that tower," he says, looking at the tower and not at you, '+
   '"with one window that faces the whole boardwalk. You can see every single person down here '+
   'from up there. Nobody can see in."',
   'The pause runs exactly one beat longer than a pause is supposed to.',
   '"It is a very boring room," Chip says. "You would hate it."']
];

                    fight:'You\'ve got the shoulders for this town and the shoes for a different one.',

    money:['The smile stays exactly where it is. Something behind it does not.',
      '"Nine and a quarter," he says, too quickly. "It\'s nine and a quarter." Then, recovering: '+

  say(beat, { speaker:CAST.chip.name, look:CAST.chip, then:()=>{

/* ---- Gil Furnace: the sunburnt tourist --------------------------------- */
function gilTalk(){
  if(GS.flags.gilPaid){ sayAs('gil', ['I can move my ARMS. Do you understand what you\'ve done '+
    'for me?','I\'m going to go stand in the ocean now. Slowly. Like a gentleman.']); return; }
  if(has('aloe')){ sayAs('gil', ['Is that — is that ALOE? Is that aloe in your hand right now?',
    'Twenty dollars. Twenty American dollars, right now, into your hand.'],
    { choices:[ { text:'Hand him the aloe.', fn:gilPayoff },
                { text:'"Let me think about it." (Keep it.)',
                  fn:()=>sayAs('gil','THINK ABOUT IT? I\'m COOKING out here!') } ] }); return; }
  sayAs('gil', ['Don\'t. Don\'t say it. I know how I look.',
    'Four hours. Four hours on a rented lounger because the girl said "you\'re already so tan" and '+
    'I believed her, because she was PAID to say that and I have a MASTER\'S DEGREE.',
    'Anything cold. Aloe, ice, a wet towel, a kind word delivered at low temperature. Twenty dollars '+
    'to the first person who brings me something cold. I am not joking. I have never been less funny '+
    'in my life.']);
}
function gilPayoff(){
  drop('aloe'); GS.flags.gilPaid = true;
  const opts = [{ text:'"Twenty. Pleasure doing business."', fn:()=>gilPay('base',
    ['He pays. He does not haggle. A man in that condition has no leverage and both of you know it.']) }];
  if(gated('gilPrice','charm')) opts.unshift({ text:'"Twenty? Gil. Look at me. This is medical."', tag:'CHARM',
    fn:()=>gilPay('charm', ['You hold the tube just out of reach and say his name like you have known '+
      'him for years. He hears a friend. He is paying a stranger thirty dollars.']) });
  if(gated('gilPrice','money')) opts.unshift({ text:'"Twenty-five, and the shade of that awning."',
    tag:'MONEY', fn:()=>gilPay('money', ['You bundle it: product, plus a service he was already getting '+
      'for free. He accepts the bundle. Everyone accepts the bundle. That is why there is always '+
      'a bundle.']) });
  if(gated('gilPrice','fight')) opts.unshift({ text:'"Twenty." (Hold out your hand. Wait.)',
    tag:'FIGHTING', fn:()=>gilPay('fight', ['You say the number once and then say nothing at all, which '+
      'is a thing you are apparently good at. He finds the twenty very quickly. He finds another five '+
      'and puts it away again while watching your face.']) });
  say('The tube changes hands. Gil makes a noise that should not be made in public.', { choices:opts });
}
function gilPay(route, lines){
  pay(earn('gilAloe', route));
  say(lines.concat(['You are ' + money() + ' into Vanity Shores. It is not power. It is the thing '+
    'you buy power with.']), { speaker:CAST.gil.name, look:CAST.gil });
}

     'you keep the gift either way.',

      'You nod at all of it, and at the end she hands you the free gift with the air of a woman '+

      '"Come back if you want to hear about financing," she says, already looking past you.']);

const BRENDA_SECRET_HEAT = 18;

function paintBoothBack(bx, by, bw, bh, t){
  const grd = g.createLinearGradient(0, by, 0, by+bh);
  grd.addColorStop(0, '#3d2255'); grd.addColorStop(1, '#7a4a6a');
  g.fillStyle = grd; g.fillRect(bx, by, bw, bh);
  r(bx, by+bh-26, bw, 26, P.wood2);                       // the boardwalk behind
  for(let x = bx; x < bx+bw; x += 9) r(x, by+bh-26, 1, 26, P.wood3);
  railing(bx, bx+bw, by+bh-34);

  const cx = bx + bw/2;
  r(cx-34, by+18, 68, 50, '#e8dcc4');                     // the back of the canopy
  r(cx-34, by+18, 68, 3, '#d0c4ac');
  r(cx-38, by+13, 76, 6, P.surf);
  textC('SHORELINE', cx, by+13, '#0a3c44', FONT.sm);
  r(cx-34, by+66, 68, 2, '#b8ac94');

  /* a structural event, entirely in the canvas wall */
  const wob = REDUCED ? 0 : Math.sin(t/170) * 3;
  const bul = REDUCED ? 4 : 4 + Math.sin(t/170) * 2.5;
  g.fillStyle = '#f2e8d4';
  g.beginPath();
  g.ellipse(cx + wob, by+42, 13 + bul, 15, 0, 0, Math.PI*2);
  g.fill();
  g.fillStyle = '#d8ccb4';
  g.beginPath(); g.ellipse(cx + wob + 5, by+46, 7, 9, 0, 0, Math.PI*2); g.fill();

  r(cx+26, by+40, 14, 22, P.gold);                        // the sign, propped up
  r(cx+27, by+41, 12, 20, '#c41d68');
  textC('FREE', cx+33, by+42, P.bone, FONT.sm);
  textC('GIFT', cx+33, by+50, P.bone, FONT.sm);

  const gx = bx + 18, gy = by + bh - 38;                  // one witness
  const turn = Math.floor(t/900) % 2;
  r(gx, gy, 4, 3, P.bone); r(gx + (turn?3:-1), gy-1, 2, 2, P.bone);
  px(gx + (turn?4:-1), gy-1, P.gold);
  r(gx+1, gy+3, 1, 2, P.gold);
}

/* Diminishing returns, and he will not play at all once you are holding table
   money. Between them the encore can never carry anyone to the win line — the
   level has to go through Monte — while the floor keeps it a real way back from
   a lost stake, so there is still no dead end. */
function encoreTake(){
  const first = earn('dickieEncore', gated('dickieEncore','charm') ? 'charm' : 'base');
  const raw = first * Math.pow(ECONOMY.encoreDecay, GS.flags.encores || 0);
  return Math.max(ECONOMY.encoreFloor, Math.round(raw/25)*25);
}
function dickieEncore(){
  const take = encoreTake();
  GS.flags.encores = (GS.flags.encores || 0) + 1;
  pay(take); Audio_.sfx('cash');
  sayAs('dickie', [(GS.flags.encores > 2
      ? 'He does it again. There are four people now, and two of them are waiting for somebody '+
        'else. He sings to them exactly as hard.'
      : 'He does it again. It is thinner the second time — the crowd is smaller, the jokes land '+
        'a half-beat late, and he knows it, and he does it anyway.'),
    'Your half comes to ' + '$' + (take/100).toFixed(2) + '. You are carrying ' + money() + '.',
    '"That\'s the business, kid," he says, not looking at you. "First set\'s the miracle. Every set '+
    'after is the *job*."'], { then:saveGame });
}

         'have a door held open."',

      : ['He straightens up off the railing, which is the most physical effort he has made today.',
         '"Oh, you are close. That is the worst thing about you. Close is where people down here '+

function chipShowdown(){
  const opts = [];
  if(gated('chipShowdown','charm')) opts.push({
    text:'"You said it was a nice hundred dollars. Hold it and say that again."',
    tag:'CHARM', fn:()=>chipTakes('charm') });
  if(gated('chipShowdown','fight')) opts.push({
    text:'Take his wrist. Put it in his hand. Close the fingers one at a time.',
    tag:'FIGHTING', fn:()=>chipTakes('force') });

  opts.push({ text:'Hold your hand out, palm up, and wait.', fn:()=>chipTakes('plain') });
  opts.push({ text:'Not yet.', fn:()=>sayAs('chip','Mm. Come back when your hands stop shaking. '+
    'I will be here. I have cleared the afternoon.') });

  sayAs('chip', ['He has seen it. He saw it before you were off the steps.',
    'The whole performance — the railing, the boredom, the four hundred yards of parking — is '+
    'still running, and underneath it Chip Winthrop is doing sums about you.',

}

/* ---- the Outrun grid: the deliberate mode switch (§7) ---- */
function vectorGrid(t, horizon, speed){
  const gr = g.createLinearGradient(0,horizon,0,SCENE_H+26);
  gr.addColorStop(0,'#2a0f4a'); gr.addColorStop(1,'#0a0416');
  g.fillStyle = gr; g.fillRect(0,horizon,W,200-horizon);
  g.strokeStyle = 'rgba(255,46,136,.75)'; g.lineWidth = 1;
  const off = REDUCED ? 0 : (t/1000*speed) % 1;
  for(let i=0;i<16;i++){                                  // receding rungs
    const k = (i + off)/16, yy = horizon + Math.pow(k,2.4)*(200-horizon);
    if(yy > 200) continue;
    g.globalAlpha = .22 + k*.65;
    g.beginPath(); g.moveTo(0,yy|0); g.lineTo(W,yy|0); g.stroke();
  }
  g.globalAlpha = .55;
  for(let i=-9;i<=9;i++){                                 // rails to the vanishing point
    g.beginPath(); g.moveTo(160 + i*3.2, horizon); g.lineTo(160 + i*46, 200); g.stroke();
  }
  g.globalAlpha = 1;
}
function vectorSun(cx, cy, rad, t){
  const gr = g.createLinearGradient(0,cy-rad,0,cy+rad);
  gr.addColorStop(0,'#fff0b0'); gr.addColorStop(.4,P.gold);
  gr.addColorStop(.72,'#ff5f6d'); gr.addColorStop(1,'#c41d68');
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,rad,0,Math.PI*2); g.fill();
  for(let i=0;i<8;i++){
    const yy = cy - rad*0.15 + i*i*0.55 + i*2.2;
    if(yy > cy+rad) break;
    r(cx-rad, yy, rad*2, 1+(i>>1), '#2a0f4a');
  }
}
function vectorPalm(x, baseY, h, col){
  g.fillStyle = col;
  g.beginPath(); g.moveTo(x-1.5, baseY); g.lineTo(x+1.5, baseY);
  g.lineTo(x+3, baseY-h); g.lineTo(x, baseY-h); g.closePath(); g.fill();
  for(let f=0;f<6;f++){
    const a = -Math.PI*0.9 + f*(Math.PI*1.8/5), L = h*0.42;
    g.beginPath(); g.moveTo(x+1, baseY-h);
    g.quadraticCurveTo(x+1+Math.cos(a)*L*0.7, baseY-h+Math.sin(a)*L*0.7 - 3,
                       x+1+Math.cos(a)*L,     baseY-h+Math.sin(a)*L + L*0.35);
    g.quadraticCurveTo(x+1+Math.cos(a)*L*0.6, baseY-h+Math.sin(a)*L*0.6 + 1, x+1, baseY-h);
    g.fill();
  }
}

/* ---- ARRIVAL INTERLUDE: full vector/synthwave mode ---- */
let driveT = 0;
function drawDrive(t){
  const k = driveT/1000;
  const gr = g.createLinearGradient(0,0,0,118);
  gr.addColorStop(0,'#120826'); gr.addColorStop(.5,'#6b2470'); gr.addColorStop(1,'#e8557f');
  g.fillStyle = gr; g.fillRect(0,0,W,118);
  vectorSun(160, 112, 40 + Math.sin(k/2)*2, t);
  r(0,116,W,2,'#ffb0d0');
  vectorGrid(t, 118, 2.6);
  const pass = (k*1.15) % 1;
  for(let i=0;i<5;i++){
    const kk = ((i/5) + pass) % 1, sc = Math.pow(kk, 2.2);
    const x = 160 + (kk<.5?-1:1) * (16 + sc*300), y = 118 + sc*74, h = 8 + sc*80;
    if(y < 200) vectorPalm(x, y, h, 'rgba(20,8,40,'+(0.45+sc*0.5)+')');
  }
  // the bus, receding
  const bs = 1 - Math.min(1, k/11);
  const bw = 34 + bs*22, bh = 20 + bs*12, bx = 160 - bw/2, by = 150 - bs*14;
  r(bx, by, bw, bh, '#241134');
  r(bx, by, bw, 2, '#5a2a72');
  r(bx+3, by+3, bw-6, bh*0.42, 'rgba(120,220,230,.45)');
  r(bx+2, by+bh, bw-4, 2, '#120826');
  r(bx-2, by+bh-4, 3, 3, '#ff5f6d'); r(bx+bw-1, by+bh-4, 3, 3, '#ff5f6d');
  g.globalAlpha=.5; r(bx-4, by+bh+2, bw+8, 1, '#ff2e88'); g.globalAlpha=1;

  const lines = [
    ['THREE HUNDRED MILES OF NOTHING,', 'AND THEN ALL OF THIS AT ONCE.'],
    ['VANITY SHORES — POP. 41,000.', 'VISITORS: EVERYBODY ELSE.'],
    ['YOU HAVE ' + money() + ', ONE BAG,', 'AND AN ORDER OF OPERATIONS.'],
    ['FIRST YOU GET THE MONEY.', 'YOU ARE FAIRLY SURE OF THE ORDER.']
  ];
  const idx = Math.min(lines.length-1, Math.floor(k/2.7));
  const fadeIn = Math.min(1, (k - idx*2.7)/0.5), out = Math.min(1, Math.max(0,(idx*2.7+2.4 - k)/0.4));
  g.globalAlpha = Math.min(fadeIn, out);
  textC(lines[idx][0], 160, 22, P.bone, FONT.sm);
  textC(lines[idx][1], 160, 34, P.gold, FONT.sm);
  g.globalAlpha = 1;
  if(Math.floor(t/700)%2===0) textC('CLICK TO SKIP', 160, 190, '#7a5f96', FONT.sm);
  if(k > 11.2) startLevelCard();
}

/* ---- LEVEL COMPLETE ---- */
function routeNotes(){
  const n = [];
  if(GS.flags.gotPremium)  n.push('Talked the shark out of the good bag.');
  else if(GS.flags.brendaWary) n.push('Stood there until the shark gave in.');
  else n.push('Sat through the pitch. Possibly twice.');
  if(GS.flags.dickiePaid)  n.push('Drew Dickie a crowd and split the jar.');
  if(GS.flags.readingDone) n.push('Paid LaRue two bits for the tell.');
  if(GS.flags.monteEnemy)  n.push('Took Monte by the wrist. He will remember it.');
  else if(GS.flags.monteWon) n.push('Beat the shells without watching the shells.');
  for(const who of ['chip','brenda']){
    const tier = heatTier(heatOf(who));
    if(tier) n.push(CAST[who].name + ' ' + tier + '.');
  }
  const fin = { plain:'Made Chip put his hand out first, and said nothing at all.',
                charm:'Made Chip say it was a nice hundred dollars, out loud, in public.',
                force:'Closed Chip\'s fingers around it one at a time.',
                math:'Paid Chip back at his own interest rate.',
                heat:'Made Chip take it slowly, while everybody watched.' }[GS.flags.chipEnding];
  if(fin) n.unshift(fin);
  if(secretsFound())
    n.push('Found ' + secretsFound() + ' of ' + SECRET_COUNT + ' things nobody mentioned.');
  if(GS.deaths) n.push('Died ' + GS.deaths + (GS.deaths===1?' time. It happens.':' times. Enthusiastically.'));
  return n;
}

  textC('NEXT — LEVEL 2: OTHER PEOPLE\'S MONEY', 160, 156, P.gold, FONT.sm);
  textC('Chip stops mocking you and starts competing.', 160, 168, '#7a5f96', FONT.sm);
  g.globalAlpha = 1;

  const bq = {x:106,y:180,w:108,h:15}, hv = inRect(mouse,bq);
  r(bq.x,bq.y,bq.w,bq.h, hv?P.hot:'#2a1140'); r(bq.x,bq.y,bq.w,1, hv?'#ff9ac8':'#5a2a72');
