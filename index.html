<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10071c">
<meta name="mobile-web-app-capable" content="yes">
<title>Vanity Shores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --void:#10071c; --dusk:#2a1140; --bezel:#1b0c2c;
  --chrome:#f5e6d3; --dim:#a08cb4;
  --hot:#ff2e88; --surf:#21e0d6; --gold:#ffc23d;
  --ui:"Silkscreen",ui-monospace,monospace;
  --body:"VT323",ui-monospace,monospace;
  --marquee:"Monoton",fantasy,cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--chrome);
  font-family:var(--ui);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:16px; overflow:hidden;
  background-image:
    radial-gradient(120% 90% at 50% 0%, #2a1140 0%, #10071c 62%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px);
}
#cab{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  max-width:100%;
}
html,body{ overscroll-behavior:none; }
#bezelwrap{
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  position:relative; line-height:0;
  padding:10px; border-radius:6px;
  background:linear-gradient(180deg,#26103c,#150a24);
  box-shadow:0 0 0 1px var(--hot), 0 0 26px -6px rgba(255,46,136,.55), 0 24px 60px -20px #000;
}
canvas#screen{
  display:block; image-rendering:pixelated; image-rendering:crisp-edges;
  background:#000; border-radius:2px; cursor:crosshair; touch-action:manipulation;
  max-width:100%;
}
#scan{
  position:absolute; inset:10px; pointer-events:none; border-radius:2px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
  mix-blend-mode:multiply;
}
#vig{
  position:absolute; inset:10px; pointer-events:none; border-radius:2px;
  background:radial-gradient(115% 105% at 50% 45%, transparent 55%, rgba(16,7,28,.55) 100%);
}
#namebox{
  position:absolute; display:none; font-family:var(--body);
  background:#1a0f2e; color:var(--gold); border:2px solid var(--hot);
  outline:none; padding:2px 6px; letter-spacing:.06em;
  /* 16px or larger, or iOS zooms the whole page in when it takes focus */
  font-size:16px;
}
#namebox:focus-visible{box-shadow:0 0 0 2px var(--surf)}
#strip{
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:center;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  min-height:16px;
}
#strip b{color:var(--chrome);font-weight:400}
#strip .m{color:var(--gold)} #strip .f{color:var(--hot)} #strip .c{color:var(--surf)}
#strip .sep{color:#4b3168}
#foot{
  font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#6b4d8a;
  text-align:center; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
}
#foot button{
  font:inherit; letter-spacing:.16em; text-transform:uppercase;
  background:none; border:none; color:#8a68ad; cursor:pointer; padding:2px 4px;
}
#foot button:hover{color:var(--surf)}
#foot button:focus-visible{outline:2px solid var(--surf);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important} }
</style>

<div id="cab">
  <div id="bezelwrap">
    <canvas id="screen" width="320" height="200" aria-label="Vanity Shores game screen"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
    <input id="namebox" maxlength="14" autocomplete="off" spellcheck="false"
           autocapitalize="characters" autocorrect="off" enterkeyhint="done"
           aria-label="Enter your name">
  </div>
  <div id="strip"></div>
  <div id="foot">
    <button id="btnMusic" type="button">Music: On</button>
    <button id="btnSfx" type="button">Sound FX: On</button>
    <button id="btnScale" type="button">Size</button>
    <button id="btnWipe" type="button">Erase Save</button>
    <span>Act 1 &middot; Free Demo &middot; keys M / N</span>
  </div>
</div>
<!-- The game was one file until it was four thousand lines. It is still one
     page with no build step and no dependencies: these are plain scripts in
     dependency order, which keeps it openable straight off a disk. A new level
     is a new file added before shell.js, which is where boot() lives. -->
<script src="js/core.js"></script>
<script src="js/cast.js"></script>
<script src="js/text.js"></script>
<script src="js/scenery.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/passcode.js"></script>
<script src="js/level1.js"></script>
<script src="js/level2.js"></script>
<script src="js/shell.js"></script>
