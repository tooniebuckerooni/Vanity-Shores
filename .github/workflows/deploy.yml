# Guards every push, and publishes to GitHub Pages from the default branch.
#
#   game   ->  https://tooniebuckerooni.github.io/Vanity-Shores/
#   bible  ->  https://tooniebuckerooni.github.io/Vanity-Shores/docs/game-bible.html
#
# ONE ONE-TIME SWITCH, in the repo's web settings:
#
#   Settings -> Pages -> Source: "GitHub Actions".
#
# It cannot be done from here. GITHUB_TOKEN is not an admin no matter what
# permissions the workflow asks for, so enablement:true fails with "Resource
# not accessible by integration". Somebody with admin has to click it once.
#
# claude/level-1-game-build-ip4kml is this repo's default branch, so the deploy
# job runs on it and the github-pages environment's branch policy is satisfied.
# If the default branch ever changes, the deploy follows it — but the new
# branch may then need adding under Settings -> Environments -> github-pages.
name: Deploy

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Name this build (e.g. level-1-testers). Leave blank for a dated tag.'
        required: false
        type: string

permissions:
  contents: write        # to push the milestone tag
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs on every branch. This is the part that is allowed to fail, because a
  # failure here means the game is actually broken.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the game parses before shipping it to anybody
        run: |
          awk '/^<script>/{f=1;next} /^<\/script>/{f=0} f' index.html > /tmp/game.js
          node --check /tmp/game.js
          echo "index.html: $(wc -l < index.html) lines, $(wc -c < index.html) bytes"

  # Only from the default branch, or by hand. Feature branches skip this rather
  # than failing on the github-pages environment's branch policy.
  deploy:
    needs: check
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The game is one self-contained file with no build step, so "building"
      # is just handing the repo to Pages as-is.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: pages
        uses: actions/deploy-pages@v4

      - name: Tag the milestone
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NAME="${{ github.event.inputs.milestone }}"
          if [ -n "$NAME" ]; then
            TAG="$NAME"
          else
            TAG="build-$(date -u +%Y%m%d-%H%M)"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, leaving it alone."
          else
            git tag -a "$TAG" -m "Live at ${{ steps.pages.outputs.page_url }}"
            git push origin "$TAG"
            echo "Tagged $TAG"
          fi
