# Guards every push, and publishes to GitHub Pages from the default branch.
#
#   game   ->  https://tooniebuckerooni.github.io/Vanity-Shores/
#   bible  ->  https://tooniebuckerooni.github.io/Vanity-Shores/docs/game-bible.html
#
# ONE ONE-TIME SWITCH, in the repo's web settings:
#
#   Settings -> Pages -> Source: "GitHub Actions".
#
# It cannot be done from here. GITHUB_TOKEN is not an admin no matter what
# permissions the workflow asks for, so enablement:true fails with "Resource
# not accessible by integration". Somebody with admin has to click it once.
#
# claude/level-1-game-build-ip4kml is this repo's default branch, so the deploy
# job runs on it and the github-pages environment's branch policy is satisfied.
# If the default branch ever changes, the deploy follows it — but the new
# branch may then need adding under Settings -> Environments -> github-pages.
name: Deploy

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Name this build (e.g. level-1-testers). Leave blank for a dated tag.'
        required: false
        type: string

permissions:
  contents: write        # to push the milestone tag
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs on every branch. This is the part that is allowed to fail, because a
  # failure here means the game is actually broken.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the game parses before shipping it to anybody
        run: |
          # The game is plain scripts in dependency order, no build step, so
          # "building" is checking each one parses and handing the repo to Pages.
          for f in js/*.js; do node --check "$f" || exit 1; echo "  ok $f"; done
          # index.html must actually load them, or Pages serves a blank page.
          for f in js/*.js; do
            grep -q "src=\"$f\"" index.html || { echo "::error::$f is not loaded by index.html"; exit 1; }
          done
          echo "$(ls js/*.js | wc -l) scripts, $(cat js/*.js | wc -l) lines total"

      # Canon reads the shipping game and asserts the rules that are otherwise
      # only prose in CLAUDE.md: no required beat gated on every route, no build
      # that cannot finish, no route to the win line that skips Monte, no state
      # read but never written. An error here is a game that must not ship.
      - name: Canon — the invariants must hold
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node tools/canon-test.js
          node tools/canon.js --check
          # And the one that asks the question a player asks first: can I get
          # there by clicking? Level 2 shipped with its win line unreachable
          # while every other check above passed.
          node tools/playthrough.js

  # Only from the default branch, or by hand. Feature branches skip this rather
  # than failing on the github-pages environment's branch policy.
  deploy:
    needs: check
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Until somebody flips the switch, every Pages step below would fail on
      # infrastructure rather than on the game. Ask first, and say so plainly.
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ON=$(gh api "repos/${{ github.repository }}" --jq .has_pages)
          echo "enabled=$ON" >> "$GITHUB_OUTPUT"
          if [ "$ON" != "true" ]; then
            echo "::warning::Pages is not enabled on this repo, so there is nothing to deploy to. Turn it on once at Settings -> Pages -> Source: GitHub Actions, then re-run this workflow. The game itself is fine — it passed the parse check."
          fi

      # The game is one self-contained file with no build step, so "building"
      # is just handing the repo to Pages as-is.
      - if: steps.site.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.site.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: pages
        if: steps.site.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Tag the milestone
        if: steps.site.outputs.enabled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NAME="${{ github.event.inputs.milestone }}"
          if [ -n "$NAME" ]; then
            TAG="$NAME"
          else
            TAG="build-$(date -u +%Y%m%d-%H%M)"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, leaving it alone."
          else
            git tag -a "$TAG" -m "Live at ${{ steps.pages.outputs.page_url }}"
            git push origin "$TAG"
            echo "Tagged $TAG"
          fi
